name: Insight Forge -- Daily Content Pipeline

on:
  schedule:
    # Executa diariamente às 11:08 UTC (08:08 Horário de Brasília) - minuto ímpar para evitar fila do GitHub
    - cron: '8 11 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Suíte de Testes Unitários
        run: |
          python -m unittest discover -s tests

      - name: Executar Pipeline Multiagente de Conteúdo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python main.py --linkedin --publish

      - name: Criar Pull Request Automático com os Rascunhos
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(content): add daily post draft and visual banner asset"
          title: "🤖 [Insight Forge] Novo Post Gerado para Revisão"
          body: |
            ## 🚀 Novo Artigo Gerado pelo Pipeline Multiagente

            Este Pull Request foi gerado automaticamente pela execução diária do **Insight Forge**.

            ### 📋 O que foi incluído:
            - **Novo artigo em Markdown** salvo em `posts/`
            - **Capa visual personalizada** salva em `posts/images/`

            ---
            ### 🔍 Próximos Passos:
            1. Revise a redação e os metadados do arquivo em `posts/`.
            2. Faça o **Merge** deste Pull Request para aprovar o conteúdo.
          branch: "automated-content-pipeline"
          base: "main"
          delete-branch: true
