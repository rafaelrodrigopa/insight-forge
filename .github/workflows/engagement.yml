name: Automated LinkedIn Engagement Pipeline

on:
  schedule:
    - cron: '17 */3 * * *' # Executa a cada 3 horas no minuto 17 para evitar fila do GitHub
  workflow_dispatch:

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Engagement Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python run_engagement.py --publish --limit 2

      - name: Commit and push engagement history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add engagement_history.json || true
          git commit -m "chore(engagement): update engagement history [skip ci]" || exit 0
          git push
